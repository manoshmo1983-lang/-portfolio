<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menna Elberry | Portfolio</title>
  <meta name="description" content="Menna Elberry's academic portfolio — Software Engineering student.">

  <style>
    :root {
      --bg: #0b0910;
      --panel: #15111d;
      --panel-2: #1d1728;
      --purple: #b98aff;
      --purple-bright: #d1adff;
      --text: #f7f2ff;
      --muted: #b9aec7;
      --line: rgba(209, 173, 255, .18);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 85% 5%, rgba(126,72,177,.20), transparent 32rem),
        radial-gradient(ellipse at 5% 40%, rgba(88,48,126,.12), transparent 28rem),
        var(--bg);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1100px, calc(100% - 40px)); margin: auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11,9,16,.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo { font-weight: 800; letter-spacing: .3px; }
    .logo span { color: var(--purple); }
    .nav-links { display: flex; gap: 24px; color: var(--muted); font-size: .94rem; }
    .nav-links a:hover { color: var(--purple-bright); }

    .hero {
      min-height: 76vh;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      align-items: center;
      gap: 60px;
      padding: 76px 0 90px;
    }

    .eyebrow {
      color: var(--purple-bright);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: .78rem;
    }

    h1 {
      font-size: clamp(2.7rem, 6vw, 5rem);
      line-height: 1.05;
      margin: 14px 0 20px;
      letter-spacing: -2px;
    }

    h1 span { color: var(--purple); }
    .intro { color: var(--muted); font-size: 1.1rem; max-width: 610px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
